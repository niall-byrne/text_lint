StylesPath = ".vale"
Vocab = "text_lint"
MinAlertLevel = suggestion

Packages = alex, proselint, \
https://github.com/cicd-tools-org/vale/raw/main/bundles/0.1.0/cicd-tools.zip

[*]
BasedOnStyles = Vale
cicd-tools.PythonProject = YES
Vale.Terms = NO
Vale.Spelling = NO

[*.md]
BasedOnStyles = alex, proselint
alex.ProfanityUnlikely = NO
cicd-tools.PythonProject = YES
Vale.Terms = YES
Vale.Avoid = YES

[documentation/build/html/**/*.html]
BasedOnStyles = alex, sphinx
alex.Ablist = NO
alex.ProfanityUnlikely = NO
cicd-tools.PythonProject = NO
Vale.Terms = YES
Vale.Avoid = YES
