---
default_install_hook_types:
  - commit-msg
  - pre-commit
  - pre-push
repos:
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: 74cf4f59d6c934ffddf5adf1fc2198efd9162e18
    hooks:
      - id: python-safety-dependencies-check
        # 72132: zipp is not being used, dependency of importlib_metadata
        args: ["-i 72132"]
        stages: [commit]
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.32.0
    hooks:
      - id: yamllint
        args:
          - "-c"
          - "./.yamllint.yml"
        stages: [commit]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        exclude: "testing_shim"
        stages: [commit]
  - repo: https://github.com/cicd-tools-org/pre-commit.git
    rev: 4cff0b6f83b44f294051987c8dd9d7bfdb171e6e
    hooks:
      - id: 10-sphinx-build-html
        args:
          - "-g"
          - "documentation/source/codebase/text_lint/_autosummary"
          - "-p"
          - "documentation"
        stages: [pre-push]
      - id: format-shell
        args:
          - "-w"
          - "--indent=2"
          - "-ci"
          - "-sr"
      - id: format-toml
      - id: gettext-translations-add
        args:
          - "-p"
          - "text_lint/locales"
      - id: gettext-translations-compile
        args:
          - "-p"
          - "text_lint/locales"
      - id: gettext-translations-missing
        args:
          - "-p"
          - "text_lint/locales"
          - "-s"
          - "en"
      - id: gettext-translations-update
        args:
          - "-p"
          - "text_lint/locales"
          - "-c"
          - "text_lint"
          - "-e"
          - "niall@niallbyrne.ca"
          - "-u"
      - id: git-conflict-markers
      - id: lint-github-workflow
      - id: lint-github-workflow-header
      - id: lint-markdown
        args:
          - "-c"
          - ".markdownlint.yml"
      - id: lint-shell
        args:
          - "--color=always"
          - "--source-path=SCRIPTDIR"
          - "--exclude=SC2317"
          - "-x"
      - id: poetry-lint-python
      - id: poetry-types-python
      - id: pre-commit-sort-config
      - id: security-credentials
      - id: spelling-commit-message
      - id: spelling-markdown
      - id: spelling-sphinx-html
        args:
          - "-g"
          - "documentation/source/codebase/text_lint/_autosummary"
          - "-p"
          - "documentation"
        stages: [pre-push]
      - id: spelling-vale-sync
      - id: spelling-vale-vocab
        files: "^.vale/Vocab/.+/(accept|reject)\\.txt$|^.vale/sphinx/ignore/.+\\.txt$"
      - id: sphinx-translations-add
        args:
          - "-e"
          - "niall@niallbyrne.ca"
          - "-g"
          - "documentation/source/codebase/text_lint/_autosummary"
          - "-p"
          - "documentation"
      - id: sphinx-translations-missing
        args:
          - "-g"
          - "documentation/source/codebase/text_lint/_autosummary"
          - "-p"
          - "documentation"
          - "-s"
          - "en"
      - id: sphinx-translations-update
        args:
          - "-e"
          - "niall@niallbyrne.ca"
          - "-g"
          - "documentation/source/codebase/text_lint/_autosummary"
          - "-p"
          - "documentation"
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.2.2
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/google/yapf
    rev: v0.40.2
    hooks:
      - id: yapf
        name: "yapf"
        args:
          - "-i"
          - "--parallel"
        files: "^.+\\.pyi?$"
        require_serial: true
        stages: [commit]
        types: []
  - repo: https://github.com/jshwi/docsig
    rev: v0.65.0
    hooks:
      - id: docsig
        entry: bash -c "if [[ $# -ne 0 ]]; then PYTHONPATH=$PWD docsig $@; fi"
        require_serial: true
        stages: [commit]
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort (python)
        files: "^.+\\.pyi?$"
        stages: [commit]
        types: []
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.22.0
    hooks:
      - id: check-jsonschema
        name: check-github-workflow-push-schema
        files: "^\\.github/config/workflows/workflow-push.json$"
        args:
          - "--schemafile"
          - ".github/config/schemas/workflows/workflow-push.json"
        stages: [commit]
  - repo: local
    hooks:
      - id: lint-makefile
        name: lint-makefile
        entry: poetry run ./testing_shim check -s schemas/makefile.yml
        files: "^(.+/)*Makefile$"
        exclude: "documentation/Makefile"
        language: system
        pass_filenames: true
        stages: [commit]
